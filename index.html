<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animal & Nature Facts</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f8f1;
            color: #234d20;
        }

        /* HEADER */
        header {
            background: #1b5e20;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        header p {
            font-size: 17px;
            color: #dcedc8;
        }

        /* MAIN */
        .container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .container h2 {
            text-align: center;
            font-size: 30px;
            color: #2e7d32;
            margin-bottom: 35px;
        }

        /* CATEGORY GRID */
        .categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        /* CATEGORY CARD */
        .category-card {
            background: #ffffff;
            border: 2px solid #a5d6a7;
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            color: #1b5e20;
            box-shadow: 0 6px 18px rgba(46, 125, 50, 0.15);
            transition: 0.3s ease;
        }

        .category-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(46, 125, 50, 0.25);
        }

        .category-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
        }

        .category-card h3 {
            text-align: center;
            padding: 20px 10px;
            font-size: 21px;
        }

        /* FOOTER */
        footer {
            background: #1b5e20;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 55px;
        }

        footer p {
            font-size: 15px;
            color: #dcedc8;
        }

        /* MOBILE */
        @media (max-width: 750px) {

            header h1 {
                font-size: 29px;
            }

            .categories {
                grid-template-columns: 1fr;
            }

            .category-card img {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>🌿 Animal & Nature Facts 🐾</h1>
        <p>Discover amazing real facts and fun facts about our world!</p>
    </header>


    <!-- CATEGORIES -->
    <div class="container">

        <h2>Explore Categories 🌱</h2>

        <div class="categories">

            <!-- Wild Animals -->
            <a href="wild-animals.html" class="category-card">
                <img src="wild-animals.jpg.jpeg" alt="Wild Animals">
                <h3>Wild Animals 🦁</h3>
            </a>


            <!-- Pet Animals -->
            <a href="pet-animals.html" class="category-card">
                <img src="pet-animals.jpg.jpeg" alt="Pet Animals">
                <h3>Pet Animals 🐶</h3>
            </a>


            <!-- Birds -->
            <a href="birds.html" class="category-card">
                <img src="birds.jpg.jpeg" alt="Birds">
                <h3>Birds 🐦</h3>
            </a>


            <!-- Insects -->
            <a href="#" class="category-card">
                <img src="insects.jpg.jpeg" alt="Insects">
                <h3>Insects 🦋</h3>
            </a>


            <!-- Trees -->
            <a href="#" class="category-card">
                <img src="trees.jpg.jpeg" alt="Trees">
                <h3>Trees 🌳</h3>
            </a>


            <!-- Flowers -->
            <a href="#" class="category-card">
                <img src="flowers.jpg.jpeg" alt="Flowers">
                <h3>Flowers 🌸</h3>
            </a>

        </div>

    </div>


    <!-- FOOTER -->
    <footer>
        <p>🌱 Learn • Explore • Discover 🌱</p>
    </footer>

</body>
</html>
